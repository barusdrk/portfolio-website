<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Derek Barus</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1 class="logo">Derek Barus</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <button id="menu-toggle" class="menu-toggle">☰</button>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="contact">
      <h2>Get In Touch</h2>
      <p>I'm always open to discussing new opportunities, collaborations, or just chatting about technology. Feel free to reach out!</p>
      <form id="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>

        <button type="submit">Send Message</button>
        <p id="form-status" class="status"></p>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Derek Barus. Built with HTML, CSS and JavaScript.</p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
